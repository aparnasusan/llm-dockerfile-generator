[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["examples", "bench-work"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Prompt text is sent to the model verbatim; don't reflow it to satisfy line length.
"dockergen/prompts.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

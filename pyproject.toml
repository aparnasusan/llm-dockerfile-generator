[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-dockerfile-generator"
dynamic = ["version"]
description = "Generate Dockerfiles with a local open-weight LLM (Ollama), verify them with docker build, and auto-repair failures"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aparna Susan Varughese" }]
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.4",
    "rich>=13",
]
keywords = ["docker", "dockerfile", "llm", "ollama", "devops"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Software Development :: Build Tools",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40"]
dev = ["pytest>=8", "ruff>=0.6", "streamlit>=1.40"]

[project.scripts]
dockergen = "dockergen.cli:main"
dockergen-bench = "dockergen.benchmark:main"
dockergen-ui = "dockergen.ui:main"

[project.urls]
Homepage = "https://github.com/aparnasusan/llm-dockerfile-generator"

[tool.setuptools.packages.find]
include = ["dockergen*"]

[tool.setuptools.dynamic]
version = { attr = "dockergen.__version__" }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["examples", "bench-work", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Prompt text is sent to the model verbatim; don't reflow it to satisfy line length.
"dockergen/prompts.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
